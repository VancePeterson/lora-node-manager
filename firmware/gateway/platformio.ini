; ESP32 LoRa Gateway - RYLR998 to MQTT bridge
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0

build_flags =
    -DMQTT_MAX_PACKET_SIZE=512

; Upload settings (adjust for your setup)
; upload_port = COM3
; monitor_port = COM3
